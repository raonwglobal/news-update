name: Daily AI News Update

on:
  schedule:
    # 8:00 AM KST is 11:00 PM UTC previous day
    # Cron format: min hour day month weekday
    - cron: '0 23 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Debug - Check if secret is set
        run: |
          if [ -z "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "::error::SLACK_WEBHOOK_URL secret이 설정되지 않았습니다. GitHub 저장소 Settings > Secrets and variables > Actions 에서 SLACK_WEBHOOK_URL 을 등록하세요."
            exit 1
          else
            echo "SLACK_WEBHOOK_URL 이 정상적으로 설정되었습니다."
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libaugeas-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run News Crawler
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python news_crawler.py
